[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-service"
version = "0.1.0"
dependencies = [
    "django>=5.0",
    "djangorestframework",
    "psycopg[binary]",
    "pandas",
    "numpy",
    "boto3",
    "python-jose[cryptography]",
    "gunicorn",
]